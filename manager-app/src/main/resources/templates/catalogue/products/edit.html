<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Edit Product &laquo;[[${product.title}]]&raquo; &ndash; Prodshop</title>
</head>
<body>
<a data-th-href="@{/catalogue/products/{productId}(productId=${product.id})}">&larr; Back to Product</a>
<h1>Edit Product &laquo;[[${product.title}]]&raquo;</h1>
<!--<div data-th-if="${errors}">-->
<!--    <h2></h2>-->
<!--    <ul>-->
<!--        <li data-th-each="error : ${errors}" data-th-text="${error}"></li>-->
<!--    </ul>-->
<!--</div>-->
<form method="post" data-th-action="@{/catalogue/products/{productId}/edit(productId=${product.id})}">
    <label for="name">
        Title
    </label>
    <br>
    <input type="text" name="title" id="name" data-th-value="${payload != null ? payload.title : product.title}">
    <br>
    <p data-th-if="${errors?.containsKey('title')}" data-th-text="${errors.title[0]}"></p>
    <label for="details">
        Description
    </label>
    <br>
    <textarea name="details" id="details" data-th-text="${payload != null ? payload.details : product.details}"></textarea>
    <br>
    <p data-th-if="${errors?.containsKey('details')}" data-th-text="${errors.details[0]}"></p>
    <button type="submit">Confirm changes</button>
</form>
</body>
</html>
