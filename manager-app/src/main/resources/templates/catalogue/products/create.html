<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>New Product</title>
</head>
<body>
<a data-th-href="@{/catalogue/products/list}">&larr; Back to Products List</a>
<h1>New Products</h1>

<!--    </ul>-->

<form method="post" data-th-action="@{/catalogue/products/create}">
    <label for="name">
        Title
    </label>
    <br>
    <input type="text" name="title" id="name" data-th-value="${payload?.title}">
    <br>
    <p data-th-if="${errors?.containsKey('title')}" data-th-text="${errors.title[0]}"></p>
    <label for="details">
        Description
    </label>
    <br>
    <textarea name="details" id="details" data-th-text="${payload?.details}"></textarea>
    <br>
    <p data-th-if="${errors?.containsKey('details')}" data-th-text="${errors.details[0]}"></p>
    <button type="submit">Create</button>
</form>
</body>
</html>
