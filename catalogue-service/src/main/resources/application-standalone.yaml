spring:
  datasource:
    url: jdbc:postgresql://localhost:5437/catalogue
    username: catalogue
    password: catalogue
  jpa:
    show-sql: true
  flyway:
    schemas:
      - public
      - catalogue
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8082/realms/appstore
server:
  port: 8081
  tomcat:
    uri-encoding: UTF-8