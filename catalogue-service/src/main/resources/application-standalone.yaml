spring:
  security:
    user:
      name: catalogue_service_user
      password: password
      roles:
        - SERVICE

  datasource:
    url: jdbc:postgresql://localhost:5437/catalogue
    username: catalogue
    password: catalogue
  jpa:
    show-sql: true
  flyway:
    schemas:
      - public
      - catalogue

server:
  port: 8081
  tomcat:
    uri-encoding: UTF-8