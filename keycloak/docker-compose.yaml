services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./realm/:/opt/keycloak/data/import # https://www.keycloak.org/server/containers#_importing_a_realm_on_startup # I need to provide in ./realm/ .json file with all config/data(this is not automatically saved in ./realm/ as it would be, for example in postgresql
    ports:
      - "8084:8080"
    command: start-dev --import-realm


volumes:
  keycloak_data: